name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: constellation_test
          POSTGRES_USER: constellation
          POSTGRES_PASSWORD: constellation-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U constellation -d constellation_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CONSTELLATION_TEST_POSTGRES_URL: postgres://constellation:constellation-test-only@127.0.0.1:5432/constellation_test
    steps:
      - uses: actions/checkout@v4
      - name: Install native credential build dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets
      - run: bash scripts/vertical-slice.sh
      - run: bash scripts/controller-failover.sh

  web:
    name: Web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @constellation/web check
      - run: pnpm --filter @constellation/web test
      - run: pnpm --filter @constellation/web build
      - run: pnpm --filter @constellation/web format
      - run: pnpm --filter @constellation/sdk check
      - run: pnpm --filter @constellation/sdk test
      - run: pnpm --filter @constellation/docs check
      - run: pnpm --filter @constellation/docs build

  browser-e2e:
    name: Browser E2E
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - name: Install native credential build dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @constellation/e2e exec playwright install --with-deps chromium
      - run: cargo build -p constellationd
      - run: pnpm --filter @constellation/e2e test

  python-sdk:
    name: Python SDK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.0"
      - run: PYTHONPATH=packages/python-sdk/src python -m unittest discover -s packages/python-sdk/tests -v

  compatibility:
    name: Official OpenAI clients
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.0"
          cache: pip
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - name: Install native credential build dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install openai==2.47.0
      - run: bash scripts/official-client-compatibility.sh

  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @constellation/web build
      - run: pnpm --filter @constellation/desktop check
      - run: pnpm --filter @constellation/desktop test
      - name: Check Windows service host
        if: runner.os == 'Windows'
        run: cargo check -p constellation-service -p constellationd

  contracts:
    name: Contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
      - run: buf lint
      - run: buf generate
      - run: buf breaking --against 'https://github.com/${{ github.repository }}.git#branch=main'
        if: github.event_name == 'pull_request'
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: npx --yes --package=@redocly/cli@1.34.5 redocly lint openapi/constellation.openapi.yaml
